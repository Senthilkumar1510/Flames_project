name: Test PAM360 Workload Identity
  on: workflow_dispatch

  permissions:
    id-token: write

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Get OIDC Token
          run: |
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pam360" | jq -r '.value')
            echo "JWT Token:"
            echo "$TOKEN"
            echo ""
            echo "Decoded payload:"
            echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
