name: PAM360 Workload Identity - Get JWT
on: workflow_dispatch

permissions:
    id-token: write
 
 jobs:
    get-token:
      runs-on: ubuntu-latest
      steps:
      - name: Get OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pam360" | jq -r .value)

          echo "=== JWT Claims ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

          echo ""
          echo "=== COPY THIS TOKEN (expires in 5 min) ==="
          echo "$TOKEN"
          echo "==========================================="
